<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="api-base" content="/api">
  <title>Блог — СкайКлин Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../admin/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar__head">
        <a href="dashboard" class="admin-sidebar__logo">
          <span class="logo__icon" aria-hidden="true">▲</span>
          Скай<span>Клин</span>
        </a>
        <span class="admin-sidebar__badge">Админ-панель</span>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav__group">
          <p class="admin-nav__label">Главное</p>
          <a href="dashboard"><span class="admin-nav__icon">◫</span> Дашборд</a>
          <a href="requests"><span class="admin-nav__icon">✉</span> Заявки</a>
          <a href="clients"><span class="admin-nav__icon">👤</span> Клиенты</a>
        </div>
        <div class="admin-nav__group">
          <p class="admin-nav__label">Контент</p>
          <a href="posts" class="is-active"><span class="admin-nav__icon">📝</span> Блог</a>
          <a href="reviews"><span class="admin-nav__icon">★</span> Отзывы</a>
          <a href="gallery"><span class="admin-nav__icon">🖼</span> До и после</a>
          <a href="partners"><span class="admin-nav__icon">🤝</span> Клиенты</a>
        </div>
        <div class="admin-nav__group">
          <p class="admin-nav__label">Система</p>
          <a href="settings"><span class="admin-nav__icon">⚙</span> Настройки</a>
          <a href="../" target="_blank"><span class="admin-nav__icon">↗</span> Открыть сайт</a>
        </div>
      </nav>
      <div class="admin-sidebar__foot">
        <div class="admin-sidebar__user">
          <div class="admin-sidebar__avatar">АД</div>
          <div>
            <p class="admin-sidebar__name">Администратор</p>
            <p class="admin-sidebar__role">admin@skyclin.ru</p>
          </div>
        </div>
        <a href="login" class="admin-sidebar__logout">Выйти</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar__left">
          <button class="admin-burger" id="admin-burger" aria-label="Меню"><span></span><span></span><span></span></button>
          <h1>Блог</h1>
        </div>
        <div class="admin-topbar__actions">
          <button class="btn btn--primary btn--sm" type="button" data-posts-open>+ Новая статья</button>
        </div>
      </header>

      <div class="admin-content">
        <div class="admin-panel">
          <div class="admin-panel__body admin-panel__body--flush">
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Статья</th>
                    <th>Slug</th>
                    <th>Дата</th>
                    <th>Статус</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="posts-tbody">
                  <tr>
                    <td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted)">Загрузка…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-modal-overlay" id="modal-blog">
    <div class="admin-modal admin-modal--wide">
      <div class="admin-modal__head">
        <h2 id="posts-modal-title">Новая статья</h2>
        <button class="admin-modal__close" type="button" data-modal-close aria-label="Закрыть">×</button>
      </div>
      <form class="admin-form" id="posts-form">
        <input type="hidden" name="remove_video" value="0">
        <label>
          <span>Заголовок (title)</span>
          <input type="text" id="posts-title" name="title" required placeholder="Название статьи">
        </label>
        <label>
          <span>URL (slug)</span>
          <input type="text" id="posts-slug" name="slug" placeholder="автоматически-из-заголовка">
          <p class="admin-form__hint">Заполняется автоматически из заголовка. Можно изменить вручную.</p>
        </label>
        <label>
          <span>Описание (description)</span>
          <textarea name="description" rows="2" placeholder="Краткое описание для карточки и SEO"></textarea>
        </label>
        <label>
          <span>Ключевые слова (keywords)</span>
          <input type="text" name="keywords" placeholder="мойка фасада, альпинизм, обратный осмос">
        </label>
        <div class="admin-form__row">
          <label>
            <span>Обложка (изображение)</span>
            <input type="file" name="cover" accept="image/jpeg,image/png,image/webp,image/gif">
            <div class="admin-upload-preview" id="posts-cover-preview"></div>
          </label>
          <label>
            <span>Видео</span>
            <input type="file" name="video" accept="video/mp4,video/webm,video/quicktime">
            <div class="admin-upload-preview" id="posts-video-preview"></div>
            <div id="posts-remove-video-wrap" hidden>
              <button type="button" class="btn btn--ghost btn--sm" id="posts-remove-video">Удалить видео</button>
            </div>
          </label>
        </div>
        <label>
          <span>Текст статьи</span>
          <textarea name="content" rows="10" placeholder="Полный текст статьи. Можно использовать HTML: &lt;p&gt;, &lt;h2&gt;, &lt;ul&gt;, &lt;img&gt;…"></textarea>
        </label>
        <label>
          <span>Статус</span>
          <select name="status">
            <option value="draft">Черновик</option>
            <option value="published">Опубликовано</option>
          </select>
        </label>
        <div class="admin-form__actions">
          <button type="submit" class="btn btn--primary">Сохранить</button>
          <button type="button" class="btn btn--ghost" data-modal-close>Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/js/auth.js?v=6"></script>
  <script src="/admin/js/admin.js?v=6"></script>
  <script src="/admin/js/posts.js?v=6"></script>
</body>
</html>
