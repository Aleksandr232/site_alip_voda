<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="api-base" content="/api">
  <title>Клиенты — СкайКлин Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../admin/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar__head">
        <a href="dashboard" class="admin-sidebar__logo">
          <span class="logo__icon" aria-hidden="true">▲</span>
          Скай<span>Клин</span>
        </a>
        <span class="admin-sidebar__badge">Админ-панель</span>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav__group">
          <p class="admin-nav__label">Главное</p>
          <a href="dashboard"><span class="admin-nav__icon">◫</span> Дашборд</a>
          <a href="requests"><span class="admin-nav__icon">✉</span> Заявки</a>
          <a href="clients" class="is-active"><span class="admin-nav__icon">👤</span> Клиенты</a>
        </div>
        <div class="admin-nav__group">
          <p class="admin-nav__label">Контент</p>
          <a href="posts"><span class="admin-nav__icon">📝</span> Блог</a>
          <a href="reviews"><span class="admin-nav__icon">★</span> Отзывы</a>
          <a href="gallery"><span class="admin-nav__icon">🖼</span> До и после</a>
          <a href="partners"><span class="admin-nav__icon">🤝</span> Партнёры</a>
        </div>
        <div class="admin-nav__group">
          <p class="admin-nav__label">Система</p>
          <a href="settings"><span class="admin-nav__icon">⚙</span> Настройки</a>
          <a href="../" target="_blank"><span class="admin-nav__icon">↗</span> Открыть сайт</a>
        </div>
      </nav>
      <div class="admin-sidebar__foot">
        <div class="admin-sidebar__user">
          <div class="admin-sidebar__avatar">АД</div>
          <div>
            <p class="admin-sidebar__name">Администратор</p>
            <p class="admin-sidebar__role">admin@skyclin.ru</p>
          </div>
        </div>
        <a href="login" class="admin-sidebar__logout">Выйти</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar__left">
          <button class="admin-burger" id="admin-burger" aria-label="Меню"><span></span><span></span><span></span></button>
          <h1>Клиенты</h1>
        </div>
      </header>

      <div class="admin-content">
        <div class="admin-toolbar">
          <div class="admin-search">
            <input type="search" id="clients-search" placeholder="Поиск по имени, телефону или email…">
          </div>
        </div>

        <div class="admin-panel">
          <div class="admin-panel__body admin-panel__body--flush">
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Имя</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Добавлен</th>
                    <th>Заявок</th>
                  </tr>
                </thead>
                <tbody id="clients-tbody">
                  <tr>
                    <td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted)">Загрузка…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin/js/auth.js?v=4"></script>
  <script src="/admin/js/admin.js?v=4"></script>
  <script src="/admin/js/clients.js?v=4"></script>
</body>
</html>
