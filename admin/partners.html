<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="/api">
  <title>Партнёры — СкайКлин Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../admin/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar__head">
        <a href="dashboard" class="admin-sidebar__logo">
          <span class="logo__icon" aria-hidden="true">▲</span>
          Скай<span>Клин</span>
        </a>
        <span class="admin-sidebar__badge">Админ-панель</span>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav__group">
          <p class="admin-nav__label">Главное</p>
          <a href="dashboard"><span class="admin-nav__icon">◫</span> Дашборд</a>
          <a href="requests"><span class="admin-nav__icon">✉</span> Заявки</a>
          <a href="clients"><span class="admin-nav__icon">👤</span> Клиенты</a>
        </div>
        <div class="admin-nav__group">
          <p class="admin-nav__label">Контент</p>
          <a href="posts"><span class="admin-nav__icon">📝</span> Блог</a>
          <a href="reviews"><span class="admin-nav__icon">★</span> Отзывы</a>
          <a href="gallery"><span class="admin-nav__icon">🖼</span> До и после</a>
          <a href="partners" class="is-active"><span class="admin-nav__icon">🤝</span> Партнёры</a>
        </div>
        <div class="admin-nav__group">
          <p class="admin-nav__label">Система</p>
          <a href="settings"><span class="admin-nav__icon">⚙</span> Настройки</a>
          <a href="../" target="_blank"><span class="admin-nav__icon">↗</span> Открыть сайт</a>
        </div>
      </nav>
      <div class="admin-sidebar__foot">
        <div class="admin-sidebar__user">
          <div class="admin-sidebar__avatar">АД</div>
          <div>
            <p class="admin-sidebar__name">Администратор</p>
            <p class="admin-sidebar__role">admin@skyclin.ru</p>
          </div>
        </div>
        <a href="login" class="admin-sidebar__logout">Выйти</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar__left">
          <button class="admin-burger" id="admin-burger" aria-label="Меню"><span></span><span></span><span></span></button>
          <h1>Партнёры</h1>
        </div>
        <div class="admin-topbar__actions">
          <button class="btn btn--primary btn--sm" type="button" data-partners-open>+ Добавить партнёра</button>
        </div>
      </header>

      <div class="admin-content">
        <div class="admin-panel">
          <div class="admin-panel__body admin-panel__body--flush">
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Логотип</th>
                    <th>Название</th>
                    <th>Сайт</th>
                    <th>Порядок</th>
                    <th>Статус</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="partners-tbody">
                  <tr>
                    <td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">Загрузка…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-modal-overlay" id="modal-partner">
    <div class="admin-modal">
      <div class="admin-modal__head">
        <h2 id="partners-modal-title">Добавить партнёра</h2>
        <button class="admin-modal__close" type="button" data-modal-close>×</button>
      </div>
      <form class="admin-form" id="partners-form">
        <label>
          <span>Название организации</span>
          <input type="text" name="name" required placeholder="УК «Город»">
        </label>
        <label>
          <span>Сайт</span>
          <input type="url" name="website" placeholder="https://example.ru">
          <p class="admin-form__hint">Необязательно. Можно указать example.ru — добавится https://</p>
        </label>
        <label>
          <span>Логотип</span>
          <input type="file" id="partners-logo" name="logo" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
          <div class="admin-upload-preview" id="partners-logo-preview"></div>
          <p class="admin-form__hint">PNG, JPG, WEBP, GIF или SVG, до 2 МБ. При редактировании можно не менять логотип.</p>
        </label>
        <div class="admin-form__row">
          <label>
            <span>Порядок на сайте</span>
            <input type="number" name="sort" value="1" min="0">
          </label>
          <label>
            <span>Статус</span>
            <select name="status">
              <option value="published">На сайте</option>
              <option value="hidden">Скрыт</option>
            </select>
          </label>
        </div>
        <div class="admin-form__actions">
          <button type="submit" class="btn btn--primary">Сохранить</button>
          <button type="button" class="btn btn--ghost" data-modal-close>Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/js/auth.js?v=7"></script>
  <script src="/admin/js/admin.js?v=7"></script>
  <script src="/admin/js/partners.js?v=9"></script>
</body>
</html>
