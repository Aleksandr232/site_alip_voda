<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Статья блога СкайКлин">
  <meta name="keywords" content="">
  <title>Статья — СкайКлин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="top">
    <div class="container header__inner">
      <a href="/" class="logo">
        <span class="logo__icon" aria-hidden="true">▲</span>
        <span class="logo__text">Скай<span>Клин</span></span>
      </a>
      <nav class="nav" id="nav">
        <a href="/#services">Услуги</a>
        <a href="/#technology">Технологии</a>
        <a href="/#before-after">До и после</a>
        <a href="/#reviews">Отзывы</a>
        <a href="/#partners">Партнёры</a>
        <a href="/blog" class="nav__active">Блог</a>
        <a href="/#contact" class="nav__cta">Заказать</a>
      </nav>
      <button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main id="article-root">
    <article class="article">
      <header class="article__header">
        <div class="container article__header-inner">
          <a href="/blog" class="article__back">← Все статьи</a>
          <div class="blog-card__meta">
            <time class="blog-card__date" id="article-date" datetime="">…</time>
          </div>
          <h1 id="article-title">Загрузка…</h1>
          <p class="article__lead" id="article-lead"></p>
        </div>
      </header>

      <div class="article__cover" id="article-cover" hidden></div>
      <div class="article__video-wrap" id="article-video" hidden></div>

      <div class="container article__body">
        <div class="article__content" id="article-content">
          <p>Загрузка статьи…</p>
        </div>

        <aside class="article__sidebar">
          <div class="sidebar-card sidebar-card--accent">
            <h3>Нужна помощь?</h3>
            <p>Позвоните нам или оставьте заявку на сайте.</p>
            <a href="/#contact" class="btn btn--primary btn--full">Заказать мойку</a>
          </div>
        </aside>
      </div>
    </article>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <a href="/" class="logo logo--footer">
        <span class="logo__icon" aria-hidden="true">▲</span>
        <span class="logo__text">Скай<span>Клин</span></span>
      </a>
      <p>© 2026 СкайКлин. Мойка фасадов и окон альпинистами.</p>
      <div class="footer__links">
        <a href="/blog">Блог</a>
        <a href="/#contact">Контакты</a>
      </div>
      <a href="#top" class="footer__top">Наверх ↑</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/blog.js?v=1"></script>
</body>
</html>
